# Static analysis for the mod's own Python (scripts/ and the gates in it).
# There is no third-party runtime dependency to install: ruff and mypy are
# developer/CI tools, invoked by scripts/lint-python.sh and blocking in CI.
# scripts/test_stdlib_only.py holds the "no third-party import" claim, so a
# dependency arrives in the manifest rather than on one contributor's disk.
#
# `ruff format` owns the layout of the tree, and `ruff format --check` is part
# of the lint gate, so formatting is a property of the checkout rather than of
# whoever last touched a file.

# The manifest, so `uv lock` resolves against the interpreter floor the suite
# runs on. Without it uv falls back to its own default and writes
# requires-python = ">=3.14" into uv.lock, which refuses a 3.10 or 3.12
# interpreter the rest of the repo supports. The package is virtual and has
# no runtime dependencies: nothing here is built or published. ruff and mypy
# are the `dev` group, pinned here and nowhere else; uv.lock pins and hashes
# the distributions mypy pulls in, because an unpinned one of those enters the
# lint lane unreviewed the day it is published. `make lint-python` runs
# through `uv run --locked`, which installs the group from uv.lock.
# The mod's own version is declared in ModInfo.xml, not here.
[project]
name = "wrench-dev-tools"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[tool.ruff]
line-length = 100
# The floor is 3.10 (test_toolchain_floor.py holds mypy, the runner and the
# README to this number). py38 here would let pyupgrade rewrite towards 3.8
# and leave 3.10-only stdlib calls unchecked by the target version.
target-version = "py310"
extend-exclude = [".tmp", "dist", "scripts/playtest/dist"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # ruff defaults: imports, syntax, IO
    "F",                # pyflakes
    "E501",             # line length, capped above
    "W",                # whitespace
    "I",                # import order
    "B",                # bugbear: mutable defaults, zip strictness
    "UP",               # pyupgrade
    "SIM",              # simplifiable control flow
    "C4",               # comprehensions
    "RET",              # return consistency
    "Q",                # quote style
    "PIE",              # misc lints
    "PLE", "PLW",       # pylint errors and warnings (subprocess without check)
    "RUF",              # ruff-specific
    "PERF",             # per-call performance traps
    "LOG", "G",         # logging calls, string formatting in logging
    "ASYNC",            # async correctness
    "EXE",              # a shebang on a file with no execute bit
    "ARG",              # unused arguments
    "TID",              # tidy imports: no relative imports past the package
    "PGH",              # blanket `# type: ignore` instead of a code, and
                         # a type: ignore that matches nothing
    "BLE",              # blind except: an except that swallows a name it
                         # did not raise
    "A",                # builtins shadowed by a module-level name
    "ERA",              # commented-out code left behind by an edit
    "DTZ",              # naive datetime where the tz is a real value
    "T10",              # a debugger breakpoint left in a gate
    "TRY300",           # a return inside try, so the except swallows cleanup
    "TRY400",           # logging.error where logging.exception belongs
    "PLR1711",          # a bare return at the end of a function
]
# FBT: the gate suite shares one `check(name, ok, detail)` helper across every
# test script; keyword-only booleans there would be churn, not clarity.
# S: bandit would flag every subprocess and XML parse in the tools, which is
# the point of these tools. Run semgrep for the security lane instead.
ignore = ["FBT", "S"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts"]
# The gates exec themselves and shell out; untyped third-party modules are
# never imported, so nothing needs silencing here.
warn_unreachable = true
# Checks strict does not turn on: a bare `# type: ignore` that silences
# every code, a value read before it is set, a condition whose outcome the
# checker already knows, a bool-typed value used as a condition, and an
# override that neither widens the base signature nor forbids mutation.
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "explicit-override",
    "mutable-override",
]
