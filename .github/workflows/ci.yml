name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Pinned image, not ubuntu-latest: the gates below are only as comparable
    # as the toolchain they run on, and a new image means a new Python, zip
    # and .NET SDK under the same commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The same installer the README and AGENTS.md name, so the lint lane
      # resolves the dev group from uv.lock through one resolver in CI and on
      # a contributor's machine. Named by tag, not by commit, because the
      # tag is the reference AGENTS.md records; a commit pin belongs here and
      # needs the digest fetched from the registry, which no gate can do
      # offline.
      - uses: astral-sh/setup-uv@v5
      - name: Offline gates
        run: make test
      - name: Python static analysis (ruff, mypy --strict)
        # make lint-python runs through `uv run --locked`, which installs the
        # dev group at the versions uv.lock pins, so a green local run and a
        # green remote run mean the same thing.
        run: make lint-python
      - name: Shellcheck
        run: make lint-shell
      - name: Package layout and byte-reproducibility
        # The same script `make check` runs locally, so a green local run
        # means a green push. The DLL build needs the proprietary game
        # assemblies, so the script stages the XML-only package instead of
        # deleting src/ from the checkout.
        run: make verify-package
      - name: Build environment
        # The interpreter, the .NET SDK, zip and the analyzers are whatever
        # the pinned image happens to carry, so they are recorded here with
        # the artifact they produced: a package that stops reproducing is
        # only diagnosable against the tool versions that made it.
        run: make buildinfo
