name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Offline gates
        run: make test
      - name: Python static analysis (ruff, mypy --strict)
        # Pinned to the versions pyproject.toml is written against, so a
        # green local run and a green remote run mean the same thing.
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4 mypy==2.3.1
          make lint-python
      - name: Shellcheck
        run: make lint-shell
      - name: Package layout (no game install -> XML-only package)
        # The DLL build needs the proprietary game assemblies; stage the
        # XML-only package instead of deleting src/ from the checkout.
        run: |
          WRENCH_SKIP_DLL=1 make package
          unzip -l dist/Wrench.zip | grep -q "Wrench/ModInfo.xml"
