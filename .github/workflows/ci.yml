name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Pinned image, not ubuntu-latest: the gates below are only as comparable
    # as the toolchain they run on, and a new image means a new Python, zip
    # and .NET SDK under the same commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Offline gates
        run: make test
      - name: Python static analysis (ruff, mypy --strict)
        # Installed from requirements-dev.txt, the one place the versions
        # are written down, so a green local run and a green remote run mean
        # the same thing.
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          make lint-python
      - name: Shellcheck
        run: make lint-shell
      - name: Package layout (no game install -> XML-only package)
        # The DLL build needs the proprietary game assemblies; stage the
        # XML-only package instead of deleting src/ from the checkout.
        run: |
          WRENCH_SKIP_DLL=1 make package
          unzip -l dist/Wrench.zip | grep -q "Wrench/ModInfo.xml"
      - name: The package is byte-reproducible
        # Same source, different umask, locale and timezone. Every entry's
        # mode and mtime is normalized, so the two archives must be equal;
        # this is the check that catches a builder-local leak into the
        # shipped bytes.
        run: |
          first="$(sha256sum dist/Wrench.zip | cut -d' ' -f1)"
          (umask 077; LC_ALL=C.UTF-8 TZ=Asia/Tokyo WRENCH_SKIP_DLL=1 make package)
          second="$(sha256sum dist/Wrench.zip | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::package is not reproducible: $first != $second"
            exit 1
          fi
          echo "reproducible: $first"
